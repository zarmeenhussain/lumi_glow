<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumiGlow • Shop Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#e11d48' }, ink: '#0f172a' },
          fontFamily: { sans: ['Poppins','ui-sans-serif','system-ui','Segoe UI'] }
        }
      }
    }
  </script>
</head>
<body class="bg-rose-50/40 text-ink font-sans">
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b border-rose-100">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2">
          <span class="inline-flex h-8 w-8 rounded-full bg-primary text-white items-center justify-center text-lg">LG</span>
          <span class="font-semibold text-xl tracking-tight">LumiGlow</span>
        </a>
        <nav class="hidden md:flex items-center gap-8">
          <a href="index.html" class="text-sm font-medium text-ink/80 hover:text-ink">Home</a>
          <a href="products.html" class="text-sm font-medium text-ink">Shop</a>
          <a href="about.html" class="text-sm font-medium text-ink/80 hover:text-ink">About</a>
          <a href="contact.html" class="text-sm font-medium text-ink/80 hover:text-ink">Contact</a>
          <a href="login.html" class="px-4 py-2 rounded-full bg-ink text-white text-sm hover:opacity-90">Login</a>
          <a href="#" class="relative inline-flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-ink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25h10.836c.86 0 1.61-.602 1.792-1.445l1.273-5.91a1.125 1.125 0 0 0-1.098-1.37H6.732M7.5 14.25 5.106 5.272M7.5 14.25l-.878 3.514A1.875 1.875 0 0 0 8.44 19.5h8.32m0 0a1.875 1.875 0 1 0 1.875 1.875M16.76 19.5a1.875 1.875 0 1 0-1.875 1.875"/></svg>
            <span id="cartCount" class="absolute -top-1 -right-2 text-xs px-1.5 py-0.5 rounded bg-primary text-white">0</span>
          </a>
        </nav>
        <button id="mobileMenuBtn" class="md:hidden inline-flex items-center justify-center h-10 w-10 rounded-lg hover:bg-rose-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-ink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
        </button>
      </div>
    </div>
    <div id="mobileMenu" class="md:hidden hidden border-t border-rose-100 bg-white">
      <div class="max-w-7xl mx-auto px-4 py-3 grid grid-cols-2 gap-3">
        <a href="index.html" class="px-4 py-2 rounded-lg hover:bg-rose-50 text-sm">Home</a>
        <a href="products.html" class="px-4 py-2 rounded-lg bg-rose-50 text-sm">Shop</a>
        <a href="about.html" class="px-4 py-2 rounded-lg hover:bg-rose-50 text-sm">About</a>
        <a href="contact.html" class="px-4 py-2 rounded-lg hover:bg-rose-50 text-sm">Contact</a>
        <a href="login.html" class="px-4 py-2 rounded-lg bg-ink text-white text-sm">Login</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10">
    <div class="flex items-end justify-between">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold">Shop All</h1>
        <p class="text-ink/70">Discover skincare, makeup, haircare and fragrance essentials.</p>
      </div>
      <div class="hidden md:flex items-center gap-3">
        <label class="text-sm text-ink/70">Sort</label>
        <select id="sortSelect" class="rounded-lg border border-rose-200 px-3 py-2 text-sm">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating-desc">Rating</option>
        </select>
      </div>
    </div>

    <div class="mt-8 grid md:grid-cols-12 gap-8">
      <aside class="md:col-span-3 space-y-6">
        <div class="p-4 rounded-2xl border border-rose-100 bg-white">
          <div class="font-semibold">Search</div>
          <input id="searchInput" placeholder="Search products" class="mt-3 w-full rounded-lg border border-rose-200 px-3 py-2" />
        </div>
        <div class="p-4 rounded-2xl border border-rose-100 bg-white">
          <div class="font-semibold">Category</div>
          <div class="mt-3 space-y-2 text-sm">
            <label class="flex items-center gap-2"><input type="checkbox" class="cat" value="Skincare"> Skincare</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="cat" value="Makeup"> Makeup</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="cat" value="Haircare"> Haircare</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="cat" value="Fragrance"> Fragrance</label>
          </div>
        </div>
        <div class="p-4 rounded-2xl border border-rose-100 bg-white">
          <div class="font-semibold">Price</div>
          <div class="mt-3 grid grid-cols-2 gap-3">
            <input id="priceMin" type="number" min="0" placeholder="Min" class="rounded-lg border border-rose-200 px-3 py-2 text-sm">
            <input id="priceMax" type="number" min="0" placeholder="Max" class="rounded-lg border border-rose-200 px-3 py-2 text-sm">
          </div>
          <button id="applyPrice" class="mt-3 w-full px-3 py-2 rounded-lg bg-rose-100 text-ink text-sm">Apply</button>
        </div>
      </aside>
      <section class="md:col-span-9">
        <div id="productsCount" class="text-sm text-ink/60"></div>
        <div id="productGrid" class="mt-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4"></div>
      </section>
    </div>
  </main>

  <footer class="border-t border-rose-100 bg-white">
    <div class="max-w-7xl mx-auto px-4 py-8 text-sm text-ink/60 flex items-center justify-between">
      <div>© <span id="year"></span> LumiGlow</div>
      <a href="index.html" class="text-primary">Back to Home</a>
    </div>
  </footer>
  <script src="assets/app.js"></script>
</body>
</html>
